services:
  app:
    build:
      context: .
      dockerfile: FlickCode/Dockerfile
    container_name: flickcode
    environment:
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
    restart: unless-stopped
    networks:
      - app-network

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - app
      - auth
      - dashboard
      - makecode

networks:
  app-network:
    driver: bridge

volumes:
  user-files:
  shared-config: