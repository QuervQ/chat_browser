<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム カーソル & チャット</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .features {
            text-align: left;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .feature {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 16px;
            color: #444;
        }

        .feature-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .room-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        #room-input {
            flex: 1;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #room-input:focus {
            border-color: #667eea;
        }

        .btn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .divider {
            margin: 30px 0;
            color: #999;
            font-size: 14px;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 36px;
            }

            .room-input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 リアルタイムルーム</h1>
        <p class="subtitle">カーソルをシェアして、みんなでチャットしよう！</p>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">✨</span>
                <span>リアルタイムでカーソル位置を共有</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💬</span>
                <span>チャットで会話ができる</span>
            </div>
            <div class="feature">
                <span class="feature-icon">👥</span>
                <span>複数人で同時に参加可能</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🌈</span>
                <span>各ユーザーに異なる色を自動割り当て</span>
            </div>
        </div>

        <div class="room-input-group">
            <input type="text" id="room-input" placeholder="ルーム名を入力 (例: my-room)" value="">
            <button class="btn" onclick="joinRoom()">参加</button>
        </div>

        <div class="divider">または</div>

        <button class="btn btn-secondary" style="width: 100%;" onclick="createRandomRoom()">
            ランダムルームを作成
        </button>

        <div class="footer">
            ルーム名を入力して参加するか、<br>
            ランダムルームを作成して友達と共有しましょう！
        </div>
    </div>

    <script>
        function joinRoom() {
            const roomName = document.getElementById('room-input').value.trim();
            if (!roomName) {
                alert('ルーム名を入力してください');
                return;
            }
            
            // 英数字とハイフンのみに変換
            const sanitizedRoomName = roomName.toLowerCase().replace(/[^a-z0-9-]/g, '-');
            window.location.href = `/room/${sanitizedRoomName}`;
        }

        function createRandomRoom() {
            const randomId = Math.random().toString(36).substring(2, 10);
            window.location.href = `/room/${randomId}`;
        }

        // Enterキーで参加
        document.getElementById('room-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinRoom();
            }
        });

        // URLにルームIDがある場合は自動的にリダイレクト
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        if (roomId) {
            window.location.href = `/room/${roomId}`;
        }
    </script>
</body>
</html>
