<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム通信アプリ</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      margin: 0 0 30px 0;
      color: #333;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background: #5568d3;
    }
    .or {
      margin: 20px 0;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 リアルタイム通信ルーム</h1>
    <div class="input-group">
      <input type="text" id="roomInput" placeholder="ルーム名を入力" />
      <button onclick="joinRoom()">入室</button>
    </div>
    <div class="or">または</div>
    <button onclick="createRandomRoom()">ランダムルームを作成</button>
  </div>

  <script>
    function joinRoom() {
      const roomId = document.getElementById('roomInput').value.trim();
      if (roomId) {
        window.location.href = `/room/${roomId}`;
      }
    }

    function createRandomRoom() {
      const randomId = Math.random().toString(36).substring(2, 10);
      window.location.href = `/room/${randomId}`;
    }

    // Enterキーで入室
    document.getElementById('roomInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        joinRoom();
      }
    });
  </script>
</body>
</html>
