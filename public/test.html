<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase接続テスト</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .log {
      background: #252526;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border-left: 3px solid #007acc;
    }
    .error {
      border-left-color: #f44336;
    }
    .success {
      border-left-color: #4caf50;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <h1>🔧 Supabase接続テスト</h1>
  
  <div>
    <button onclick="testConnection()">接続テスト</button>
    <button onclick="testMessagesTable()">messagesテーブル確認</button>
    <button onclick="testInsert()">メッセージ挿入テスト</button>
    <button onclick="testRealtime()">Realtime接続テスト</button>
    <button onclick="clearLogs()">ログクリア</button>
  </div>
  
  <div id="logs"></div>

  <script>
    // Supabase設定（直接埋め込み）
    const SUPABASE_URL = 'https://wzjasatwikzfwfnudxkm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6amFzYXR3aWt6ZndmbnVkeGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNTkwMzksImV4cCI6MjA4MDczNTAzOX0.YtUCl1dQc4JlBP4Nvkuki2UHtYCfe98I8uGrIQ0Ehic';
  </script>
  <script>
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    function log(message, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const logEl = document.createElement('div');
      logEl.className = `log ${type}`;
      logEl.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
      logsDiv.appendChild(logEl);
      logsDiv.scrollTop = logsDiv.scrollHeight;
      console.log(message);
    }
    
    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
    }
    
    async function testConnection() {
      log('🔌 接続テスト開始...');
      log(`URL: ${SUPABASE_URL}`);
      log(`Key: ${SUPABASE_ANON_KEY.substring(0, 20)}...`);
      
      try {
        const { data, error } = await supabaseClient.from('messages').select('count');
        
        if (error) {
          log(`❌ エラー: ${error.message}`, 'error');
          log(`詳細: ${JSON.stringify(error)}`, 'error');
        } else {
          log('✅ Supabase接続成功！', 'success');
        }
      } catch (err) {
        log(`❌ 例外発生: ${err.message}`, 'error');
      }
    }
    
    async function testMessagesTable() {
      log('📋 messagesテーブル確認...');
      
      try {
        const { data, error } = await supabaseClient
          .from('messages')
          .select('*')
          .limit(5);
        
        if (error) {
          log(`❌ テーブルアクセスエラー: ${error.message}`, 'error');
          log(`ヒント: Supabaseダッシュボードで以下を確認してください:`, 'error');
          log(`1. messagesテーブルが存在するか`, 'error');
          log(`2. RLSポリシーで読み取り権限があるか`, 'error');
        } else {
          log(`✅ テーブル読み取り成功！ (${data.length}件取得)`, 'success');
          log(`データ: ${JSON.stringify(data, null, 2)}`);
        }
      } catch (err) {
        log(`❌ 例外発生: ${err.message}`, 'error');
      }
    }
    
    async function testInsert() {
      log('✍️ メッセージ挿入テスト...');
      
      const testMessage = {
        room_id: 'test-room',
        user_id: 'test-user',
        name: 'テストユーザー',
        content: 'テストメッセージ ' + new Date().toLocaleTimeString()
      };
      
      try {
        const { data, error } = await supabaseClient
          .from('messages')
          .insert(testMessage)
          .select();
        
        if (error) {
          log(`❌ 挿入エラー: ${error.message}`, 'error');
          log(`詳細: ${JSON.stringify(error)}`, 'error');
          log(`ヒント: RLSポリシーで書き込み権限を確認してください`, 'error');
        } else {
          log('✅ メッセージ挿入成功！', 'success');
          log(`挿入データ: ${JSON.stringify(data, null, 2)}`, 'success');
        }
      } catch (err) {
        log(`❌ 例外発生: ${err.message}`, 'error');
      }
    }
    
    async function testRealtime() {
      log('🔴 Realtime接続テスト...');
      
      try {
        const channel = supabaseClient
          .channel('test-channel')
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages'
          }, (payload) => {
            log(`📨 Realtimeメッセージ受信: ${JSON.stringify(payload.new)}`, 'success');
          })
          .subscribe((status) => {
            log(`Realtime状態: ${status}`, status === 'SUBSCRIBED' ? 'success' : 'info');
            
            if (status === 'SUBSCRIBED') {
              log('✅ Realtime購読成功！', 'success');
              log('ヒント: Supabaseダッシュボード > Database > Replication でmessagesテーブルのRealtimeが有効か確認してください');
            }
          });
        
        // 10秒後に自動解除
        setTimeout(() => {
          channel.unsubscribe();
          log('Realtimeチャンネル解除');
        }, 10000);
        
      } catch (err) {
        log(`❌ Realtime接続エラー: ${err.message}`, 'error');
      }
    }
    
    // 初回ロード時に自動テスト
    window.onload = () => {
      log('🚀 ページ読み込み完了');
      testConnection();
    };
  </script>
</body>
</html>
