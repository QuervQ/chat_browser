<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム カーソル & チャット</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        #cursor-area {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: crosshair;
        }

        .cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            will-change: transform;
        }

        .cursor::after {
            content: attr(data-user);
            position: absolute;
            left: 25px;
            top: -5px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
        }

        #chat-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            z-index: 2000;
        }

        #chat-header {
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #online-count {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            background: #f0f0f0;
            padding: 10px 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
        }

        .message-user {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
            opacity: 0.8;
        }

        .message-text {
            font-size: 14px;
        }

        #input-container {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
        }

        #message-input {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            border-color: #667eea;
        }

        #send-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        #send-button:hover {
            transform: scale(1.05);
        }

        #send-button:active {
            transform: scale(0.95);
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        #welcome-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        #welcome-box h1 {
            margin-bottom: 20px;
            color: #667eea;
        }

        #welcome-box p {
            margin-bottom: 24px;
            color: #666;
        }

        #username-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #username-input:focus {
            border-color: #667eea;
        }

        #join-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #join-button:hover {
            transform: scale(1.02);
        }

        #join-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="welcome-screen">
        <div id="welcome-box">
            <h1>🎨 リアルタイム ルーム</h1>
            <p>カーソルの動きをシェアして、チャットで会話しよう！</p>
            <input type="text" id="username-input" placeholder="ユーザー名を入力" maxlength="20">
            <button id="join-button">参加する</button>
        </div>
    </div>

    <div id="cursor-area"></div>

    <div id="chat-container">
        <div id="chat-header">
            <span>💬 チャット</span>
            <span id="online-count">👤 0人</span>
        </div>
        <div id="messages"></div>
        <div id="input-container">
            <input type="text" id="message-input" placeholder="メッセージを入力..." maxlength="200">
            <button id="send-button">送信</button>
        </div>
    </div>

    <script>
        // Supabaseの設定（サーバーサイドで環境変数から注入されます）
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        // URLからルームIDを取得
        const roomId = window.location.pathname.split('/room/')[1] || 'default-room';
        
        let supabase;
        let myUserId;
        let myUsername;
        let myColor;  // 自分の色を保持
        let cursorChannel;
        let chatChannel;
        const cursors = new Map();
        const cursorData = new Map(); // カーソルの補間データを保持
        const lastPositions = new Map(); // 最後に受信した位置を記録
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];

        // ユーザー名入力と参加
        document.getElementById('join-button').addEventListener('click', joinRoom);
        document.getElementById('username-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });

        async function joinRoom() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) {
                alert('ユーザー名を入力してください');
                return;
            }

            myUsername = username;
            myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
            
            document.getElementById('welcome-screen').style.display = 'none';
            
            initializeSupabase();
        }

        function initializeSupabase() {
            // Supabaseクライアントの初期化
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
            
            // カーソルチャンネル（presenceとbroadcastの両方を使用）
            cursorChannel = supabase.channel(`cursor:${roomId}`, {
                config: {
                    presence: {
                        key: myUserId,
                    },
                    broadcast: {
                        self: false, // 自分のbroadcastは受信しない
                    },
                },
            });

            // 自分の色を固定
            myColor = getRandomColor();

            cursorChannel
                // presence: オンライン人数管理用
                .on('presence', { event: 'sync' }, () => {
                    const state = cursorChannel.presenceState();
                    updateOnlineCount(Object.keys(state).length);
                })
                .on('presence', { event: 'join' }, ({ key, newPresences }) => {
                    // ユーザー参加
                })
                .on('presence', { event: 'leave' }, ({ key, leftPresences }) => {
                    // ユーザー退出
                    removeCursor(key);
                })
                // broadcast: リアルタイムカーソル位置用（高速）
                .on('broadcast', { event: 'cursor-move' }, ({ payload }) => {
                    if (payload.userId !== myUserId) {
                        const lastPos = lastPositions.get(payload.userId);
                        if (!lastPos || lastPos.xRatio !== payload.xRatio || lastPos.yRatio !== payload.yRatio) {
                            lastPositions.set(payload.userId, { 
                                xRatio: payload.xRatio, 
                                yRatio: payload.yRatio 
                            });
                            requestAnimationFrame(() => {
                                updateCursor(payload.userId, payload.user, payload.xRatio, payload.yRatio, payload.color);
                            });
                        }
                    }
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        // presence登録（オンライン状態管理用）
                        await cursorChannel.track({
                            user: myUsername,
                            online: true,
                        });
                    }
                });

            // チャットチャンネル（データベースの変更を監視）
            chatChannel = supabase
                .channel(`chat:${roomId}`)
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: `room_id=eq.${roomId}`
                    },
                    (payload) => {
                        displayMessage({
                            user: payload.new.username,
                            userId: payload.new.user_id,
                            text: payload.new.message,
                        });
                    }
                )
                .subscribe();

            // 既存のメッセージを読み込む
            loadMessages();

            setupEventListeners();
            
            // カーソル補間アニメーションループ
            startCursorInterpolation();
        }

        async function loadMessages() {
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .eq('room_id', roomId)
                    .order('created_at', { ascending: true })
                    .limit(50);

                if (error) {
                    return;
                }

                if (data && data.length > 0) {
                    data.forEach(msg => {
                        displayMessage({
                            user: msg.username,
                            userId: msg.user_id,
                            text: msg.message,
                        });
                    });
                }
            } catch (error) {
                // エラーハンドリング
            }
        }

        function setupEventListeners() {
            let lastUpdate = 0;
            const UPDATE_INTERVAL = 16; // 16ms (60fps)
            
            // カーソル移動（スロットリング付き）
            document.getElementById('cursor-area').addEventListener('mousemove', (e) => {
                const now = Date.now();
                
                // スロットリング: UPDATE_INTERVAL以内の更新はスキップ
                if (now - lastUpdate < UPDATE_INTERVAL) {
                    return;
                }
                
                lastUpdate = now;
                
                // ビューポートサイズを取得
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                
                // 位置を比率(0-1)で計算
                const xRatio = e.clientX / viewportWidth;
                const yRatio = e.clientY / viewportHeight;
                
                // broadcastでカーソル位置を送信（高速）
                cursorChannel.send({
                    type: 'broadcast',
                    event: 'cursor-move',
                    payload: {
                        userId: myUserId,
                        user: myUsername,
                        xRatio: xRatio,
                        yRatio: yRatio,
                        color: myColor,
                    }
                });
            });

            // チャット送信
            document.getElementById('send-button').addEventListener('click', sendMessage);
            document.getElementById('message-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        }

        function updateCursors(state) {
            Object.entries(state).forEach(([userId, presence]) => {
                if (userId !== myUserId && presence[0]) {
                    const data = presence[0];
                    const lastPos = lastPositions.get(userId);
                    
                    // 位置が変わった場合のみ更新（補間の途中リセットを防ぐ）
                    if (!lastPos || lastPos.xRatio !== data.xRatio || lastPos.yRatio !== data.yRatio) {
                        lastPositions.set(userId, { xRatio: data.xRatio, yRatio: data.yRatio });
                        
                        // requestAnimationFrameで次のフレームで更新を保証
                        requestAnimationFrame(() => {
                            updateCursor(userId, data.user, data.xRatio, data.yRatio, data.color);
                        });
                    }
                }
            });
        }

        // イージング関数（ease-out）
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function updateCursor(userId, username, xRatio, yRatio, color) {
            let cursorEl = cursors.get(userId);
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            const targetX = xRatio * viewportWidth;
            const targetY = yRatio * viewportHeight;
            
            if (!cursorEl) {
                // 新しいカーソルを作成
                cursorEl = document.createElement('div');
                cursorEl.className = 'cursor';
                cursorEl.style.backgroundColor = color;
                cursorEl.setAttribute('data-user', username);
                document.getElementById('cursor-area').appendChild(cursorEl);
                cursors.set(userId, cursorEl);
                
                // 初期位置を設定
                cursorData.set(userId, {
                    currentX: targetX,
                    currentY: targetY,
                    targetX: targetX,
                    targetY: targetY,
                    startX: targetX,
                    startY: targetY,
                    progress: 1,
                    timestamp: Date.now()
                });
                
                cursorEl.style.transform = `translate(${targetX}px, ${targetY}px)`;
            } else {
                // 既存のカーソルを更新
                const data = cursorData.get(userId);
                if (data) {
                    // 新しいターゲット位置を設定
                    data.startX = data.currentX;
                    data.startY = data.currentY;
                    data.targetX = targetX;
                    data.targetY = targetY;
                    data.progress = 0;
                    data.timestamp = Date.now();
                } else {
                    // データが存在しない場合は初期化
                    cursorData.set(userId, {
                        currentX: targetX,
                        currentY: targetY,
                        targetX: targetX,
                        targetY: targetY,
                        startX: targetX,
                        startY: targetY,
                        progress: 1,
                        timestamp: Date.now()
                    });
                }
            }
        }

        // カーソル補間アニメーションループ
        function startCursorInterpolation() {
            const INTERPOLATION_DURATION = 100; // 100ms で補間
            
            function animate() {
                const now = Date.now();
                
                cursorData.forEach((data, userId) => {
                    const cursorEl = cursors.get(userId);
                    if (!cursorEl) return;
                    
                    // 経過時間を計算
                    const elapsed = now - data.timestamp;
                    data.progress = Math.min(elapsed / INTERPOLATION_DURATION, 1);
                    
                    // イージング関数を適用
                    const eased = easeOutCubic(data.progress);
                    
                    // 扇形補間（円弧を描くように補間）
                    const dx = data.targetX - data.startX;
                    const dy = data.targetY - data.startY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance > 5) {
                        // 距離が大きい場合は扇形補間
                        // 中間点を少し持ち上げて円弧を描く
                        const midProgress = eased;
                        const arcHeight = distance * 0.15 * Math.sin(midProgress * Math.PI);
                        
                        // 法線方向（進行方向に対して垂直）
                        const normalX = -dy / distance;
                        const normalY = dx / distance;
                        
                        // 線形補間 + 円弧オフセット
                        data.currentX = data.startX + dx * midProgress + normalX * arcHeight;
                        data.currentY = data.startY + dy * midProgress + normalY * arcHeight;
                    } else {
                        // 距離が小さい場合は線形補間
                        data.currentX = data.startX + dx * eased;
                        data.currentY = data.startY + dy * eased;
                    }
                    
                    // カーソル位置を更新
                    cursorEl.style.transform = `translate(${data.currentX}px, ${data.currentY}px)`;
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        function removeCursor(userId) {
            const cursorEl = cursors.get(userId);
            if (cursorEl) {
                cursorEl.remove();
                cursors.delete(userId);
                cursorData.delete(userId); // 補間データも削除
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message) {
                return;
            }
            
            try {
                // Supabaseデータベースにメッセージを保存
                const { data, error } = await supabase
                    .from('messages')
                    .insert([
                        {
                            room_id: roomId,
                            user_id: myUserId,
                            username: myUsername,
                            message: message,
                            created_at: new Date().toISOString(),
                        }
                    ])
                    .select();
                
                if (error) {
                    alert(`メッセージの送信に失敗しました: ${error.message}`);
                    return;
                }
                
                input.value = '';
            } catch (error) {
                alert('メッセージの送信に失敗しました');
            }
        }

        function displayMessage(data) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'message' + (data.userId === myUserId ? ' own' : '');
            
            const userEl = document.createElement('div');
            userEl.className = 'message-user';
            userEl.textContent = data.user;
            
            const textEl = document.createElement('div');
            textEl.className = 'message-text';
            textEl.textContent = data.text;
            
            messageEl.appendChild(userEl);
            messageEl.appendChild(textEl);
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateOnlineCount(count) {
            document.getElementById('online-count').textContent = `👤 ${count}人`;
        }

        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }
    </script>
</body>
</html>
