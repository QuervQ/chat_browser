<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase メッセージ送信テスト</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      padding: 40px; 
      background: #f5f5f5;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { margin-bottom: 24px; color: #333; }
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .status { 
      padding: 12px 16px; 
      border-radius: 8px; 
      margin-bottom: 16px;
      font-size: 14px;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    button { 
      padding: 12px 24px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      margin-right: 12px;
      margin-bottom: 12px;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    pre { 
      background: #f8f9fa; 
      padding: 16px; 
      border-radius: 8px; 
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    input { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid #e0e0e0; 
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #007bff; }
    .log { 
      max-height: 300px; 
      overflow-y: auto; 
      background: #1e1e1e; 
      color: #d4d4d4; 
      padding: 16px; 
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .log-entry { margin-bottom: 8px; }
    .log-entry.error { color: #f48771; }
    .log-entry.success { color: #89d185; }
    .log-entry.info { color: #75beff; }
  </style>
</head>
<body>
  <h1>🧪 Supabase メッセージ送信テスト</h1>

  <div class="card">
    <h2 style="margin-bottom: 16px;">1️⃣ テーブル存在確認</h2>
    <div id="tableStatus" class="status info">確認前...</div>
    <button onclick="checkTable()">テーブルを確認</button>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 16px;">2️⃣ メッセージ送信テスト</h2>
    <input type="text" id="roomIdInput" placeholder="ルームID（例: test-room）" value="test-room">
    <input type="text" id="messageInput" placeholder="メッセージ内容（例: Hello!）" value="テスト送信">
    <button onclick="sendTestMessage()">メッセージを送信</button>
    <div id="sendStatus"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 16px;">3️⃣ メッセージ取得テスト</h2>
    <button onclick="fetchMessages()">メッセージ一覧を取得</button>
    <div id="fetchStatus"></div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 16px;">📝 ログ</h2>
    <button onclick="clearLog()">ログをクリア</button>
    <div id="log" class="log"></div>
  </div>

  <script>
    // Supabase設定
    const SUPABASE_URL = 'https://wzjasatwikzfwfnudxkm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6amFzYXR3aWt6ZndmbnVkeGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNTkwMzksImV4cCI6MjA4MDczNTAzOX0.YtUCl1dQc4JlBP4Nvkuki2UHtYCfe98I8uGrIQ0Ehic';

    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const time = new Date().toLocaleTimeString('ja-JP');
      entry.textContent = `[${time}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    async function checkTable() {
      const statusDiv = document.getElementById('tableStatus');
      statusDiv.className = 'status info';
      statusDiv.textContent = '確認中...';
      log('テーブル存在確認を開始', 'info');

      try {
        const { data, error } = await supabase
          .from('messages')
          .select('count')
          .limit(1);

        if (error) {
          if (error.message.includes('does not exist') || error.code === '42P01') {
            statusDiv.className = 'status error';
            statusDiv.innerHTML = '❌ <strong>messagesテーブルが存在しません</strong><br>SUPABASE_SETUP.md の手順でテーブルを作成してください。';
            log(`エラー: ${error.message}`, 'error');
          } else if (error.message.includes('permission denied') || error.code === '42501') {
            statusDiv.className = 'status error';
            statusDiv.innerHTML = '⚠️ <strong>アクセス権限エラー</strong><br>RLSポリシーが設定されていない可能性があります。';
            log(`エラー: ${error.message}`, 'error');
          } else {
            statusDiv.className = 'status error';
            statusDiv.innerHTML = `❌ <strong>エラー:</strong> ${error.message}`;
            log(`エラー: ${error.message}`, 'error');
          }
        } else {
          statusDiv.className = 'status success';
          statusDiv.textContent = '✅ messagesテーブルは正常に存在します！';
          log('テーブル存在確認: OK', 'success');
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.textContent = `エラー: ${err.message}`;
        log(`例外: ${err.message}`, 'error');
      }
    }

    async function sendTestMessage() {
      const roomId = document.getElementById('roomIdInput').value.trim();
      const content = document.getElementById('messageInput').value.trim();
      const statusDiv = document.getElementById('sendStatus');

      if (!roomId || !content) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '⚠️ ルームIDとメッセージを入力してください';
        return;
      }

      statusDiv.className = 'status info';
      statusDiv.textContent = '送信中...';
      log(`メッセージ送信: room=${roomId}, content=${content}`, 'info');

      try {
        const { data, error } = await supabase
          .from('messages')
          .insert({
            room_id: roomId,
            user_id: 'test-user-' + Date.now(),
            name: 'テストユーザー',
            content: content
          })
          .select()
          .single();

        if (error) {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `❌ <strong>送信失敗:</strong><br>${error.message}`;
          log(`送信失敗: ${error.message}`, 'error');
          
          if (error.message.includes('does not exist')) {
            statusDiv.innerHTML += '<br><br>💡 SUPABASE_SETUP.md の手順でテーブルを作成してください。';
          } else if (error.message.includes('permission denied')) {
            statusDiv.innerHTML += '<br><br>💡 RLSポリシーを設定してください。';
          }
        } else {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `✅ <strong>送信成功！</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
          log(`送信成功: id=${data.id}`, 'success');
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.textContent = `例外: ${err.message}`;
        log(`例外: ${err.message}`, 'error');
      }
    }

    async function fetchMessages() {
      const statusDiv = document.getElementById('fetchStatus');
      statusDiv.className = 'status info';
      statusDiv.textContent = '取得中...';
      log('メッセージ一覧を取得中', 'info');

      try {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(10);

        if (error) {
          statusDiv.className = 'status error';
          statusDiv.textContent = `❌ 取得失敗: ${error.message}`;
          log(`取得失敗: ${error.message}`, 'error');
        } else {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `✅ <strong>${data.length}件のメッセージを取得</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
          log(`取得成功: ${data.length}件`, 'success');
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.textContent = `例外: ${err.message}`;
        log(`例外: ${err.message}`, 'error');
      }
    }

    // 初期化時にテーブル確認
    window.addEventListener('load', () => {
      log('ページ読み込み完了', 'info');
      log(`Supabase URL: ${SUPABASE_URL}`, 'info');
    });
  </script>
</body>
</html>
