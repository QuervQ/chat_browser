<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リダイレクト中...</title>
    <script>
        // GitHub PagesのSPAルーティング対応
        const path = window.location.pathname;
        const roomMatch = path.match(/\/room\/(.+)/);
        
        if (roomMatch) {
            // /room/{id} の場合
            window.location.href = '/practice-aaa/room-v3.html?room=' + roomMatch[1];
        } else {
            // トップページにリダイレクト
            window.location.href = '/practice-aaa/';
        }
    </script>
</head>
<body>
    <p>リダイレクト中...</p>
</body>
</html>
